name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Collect web files
        run: |
          mkdir www
          cp *.html *.js *.css *.png www/ 2>/dev/null || true
      - name: Bundle libraries for offline use
        run: |
          if curl -fsSL --retry 3 https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js -o www/qrcode.min.js || curl -fsSL --retry 3 https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@master/qrcode.min.js -o www/qrcode.min.js; then
            sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js#qrcode.min.js#' www/index.html
            echo "QR library bundled"
          else
            echo "QR library not bundled, keeping online link"
          fi
          if curl -fsSL --retry 3 https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js -o www/jsQR.min.js || curl -fsSL --retry 3 https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js -o www/jsQR.min.js; then
            sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js#jsQR.min.js#' www/index.html
            echo "jsQR bundled"
          else
            echo "jsQR not bundled, keeping online link"
          fi
      - run: npm install
      - run: npx cap add android
      - name: Generate icon and splash
        run: npx capacitor-assets generate --android --assetPath assets
      - name: Allow camera for QR scanning
        run: |
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' $F
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MwanaLink-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
