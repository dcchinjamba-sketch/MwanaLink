name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Collect web files
        run: |
          mkdir www
          cp *.html *.js *.css *.png www/ 2>/dev/null || true
      - name: Bundle libraries for offline use
        run: |
          curl -fL https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js -o www/qrcode.min.js
          curl -fL https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js -o www/jsQR.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js#qrcode.min.js#; s#https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js#jsQR.min.js#' www/index.html
      - run: npm install
      - run: npx cap add android
      - name: Generate icon and splash
        run: npx capacitor-assets generate --android --assetPath assets
      - name: Allow camera for QR scanning
        run: |
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' $F
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MwanaLink-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
