<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b6b58">
<title>MwanaLink | Digital Child Health Record</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="forms.css">
<link rel="stylesheet" href="card.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="logo">✚</div><div>MwanaLink<small>Every child. One connected health record.</small></div></div>
  <div class="top-right">
    <span class="pill">DEMONSTRATION ENVIRONMENT</span>
    <button class="themebtn" id="themeBtn" type="button">Theme: System</button>
  </div>
</header>
<nav class="mnav" id="mnav" aria-label="Menu"></nav>
<div class="layout">
  <aside class="sidebar">
    <div id="sidenav"></div>
    <div class="sidebar-note"><b>Prototype notice</b><br>This demonstration uses fictional records stored on this device. It is not approved for real patient information or clinical use.</div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="footer">MwanaLink · Functional prototype · Fictional demonstration data only</div>
<div id="toastRoot"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="data.js"></script>
<script src="geo.js?v=1"></script>
<script src="schedule.js?v=1"></script>
<script src="app.js"></script>
<script src="card.js"></script>
<script src="growth.js"></script>
<script src="appts.js"></script>
<script src="parent.js"></script>
<script src="reports.js?v=2"></script>
<script src="reports2.js?v=1"></script>
<script src="auth.js?v=2"></script>
<script src="rules.js?v=4"></script>
<script src="features.js?v=1"></script>
<script src="hei.js?v=1"></script>
<script src="services.js?v=1"></script>
<script src="admin.js?v=2"></script>
<script src="indicators.js?v=1"></script>
<script src="edutext.js?v=1"></script>
<script src="edu.js?v=1"></script>
<script src="logo.js"></script>
<script>
var KEY='mwl_theme',order=['system','light','dark'],btn=document.getElementById('themeBtn');
function get(){try{return localStorage.getItem(KEY)||'system'}catch(e){return 'system'}}
function apply(t){var r=document.documentElement;if(t==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);btn.textContent='Theme: '+t.charAt(0).toUpperCase()+t.slice(1)}
apply(get());
btn.onclick=function(){var n=order[(order.indexOf(get())+1)%order.length];try{localStorage.setItem(KEY,n)}catch(e){}apply(n)};
</script>
</body>
</html>
